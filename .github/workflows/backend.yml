name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend.yml'
      - 'infrastructure/**'
      - 'backend/**'
      - 'do'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'backend/**'
      - 'do'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/src/api/**'
  workflow_dispatch: null

permissions:
  id-token: write
  contents: read

jobs:
  backend-quality-gates:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "backend/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.9.5

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps (for OpenAPI check)
        run: cd frontend && npm ci

      - name: Check OpenAPI schema freshness
        run: ./do check-api-schema
        env:
          DB_URL: postgresql+psycopg://schema-check:schema-check@127.0.0.1:5432/schema_check

      - name: Format check
        run: ./backend/do fmt-check

      - name: Linting
        run: ./backend/do lint-check

      - name: Types
        run: ./backend/do types

      - name: Test
        run: ./backend/do test

  deploy-dev:
    name: Deploy Dev Environment
    runs-on: ubuntu-latest
    needs: [backend-quality-gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      api_base_url: ${{ steps.terraform_output.outputs.api_base_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "backend/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.9.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::465836752303:role/lexloop-cicd-deploy-role
          aws-region: eu-central-1

      - name: Build lambda bundle
        run: cd backend && ./do build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.0
          terraform_wrapper: false

      - name: Check infra format
        run: ./infrastructure/do fmt-check

      - name: Lint infra
        run: ./infrastructure/do lint

      - name: Deploy dev environment
        run: cd infrastructure && ./do apply-auto dev
        env:
          TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_DEV_ACCESS_TOKEN }}

      - name: Get Terraform outputs
        id: terraform_output
        run: |
          cd infrastructure/env/dev
          API_BASE_URL=$(terraform output -raw api_base_url)
          CLOUDFRONT_URL=$(terraform output -raw cloudfront_url)
          AUTH_SECRETS_ARN=$(terraform output -raw auth_secrets_arn)
          echo "api_base_url=$API_BASE_URL" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT
          echo "auth_secrets_arn=$AUTH_SECRETS_ARN" >> $GITHUB_OUTPUT

      # CloudFront URL is only known after apply; keep it in Secrets Manager so
      # Lambda can load FRONTEND_URL + OAuth redirect without a TF cycle.
      - name: Sync CloudFront URLs into auth secret
        env:
          AUTH_SECRETS_ARN: ${{ steps.terraform_output.outputs.auth_secrets_arn }}
          CLOUDFRONT_URL: ${{ steps.terraform_output.outputs.cloudfront_url }}
        run: |
          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id "$AUTH_SECRETS_ARN" \
            --query SecretString \
            --output text)
          UPDATED=$(jq -n \
            --argjson cur "$CURRENT" \
            --arg fe "$CLOUDFRONT_URL" \
            --arg re "$CLOUDFRONT_URL/api/auth/google/callback" \
            '$cur + {FRONTEND_URL:$fe, GOOGLE_OAUTH_REDIRECT_URL:$re}')
          aws secretsmanager put-secret-value \
            --secret-id "$AUTH_SECRETS_ARN" \
            --secret-string "$UPDATED"
          # Force new Lambda executions to reload Secrets Manager values.
          aws lambda update-function-configuration \
            --function-name "lex-api-dev" \
            --description "auth-urls $(date -u +%Y%m%d%H%M%S)" \
            >/dev/null

      - name: Run database migrations
        run: cd backend && ./do db-migrate-remote dev
        env:
          TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_DEV_ACCESS_TOKEN }}

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-dev]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "backend/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.9.5

      - name: Run smoke tests
        run: cd backend && ./do smoke-test
        env:
          API_BASE_URL: ${{ needs.deploy-dev.outputs.api_base_url }}
