# One-shot: write JWT + Google OAuth into Secrets Manager via OIDC.
# Not part of normal deploy — delete after use if desired.
name: Seed Auth Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "dev or prod"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      jwt_signing_secret:
        required: true
        type: string
      google_oauth_client_id:
        required: true
        type: string
      google_oauth_client_secret:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  seed:
    name: Put Secrets Manager values
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::465836752303:role/lexloop-cicd-deploy-role
          aws-region: eu-central-1

      - name: Put secret value
        env:
          JWT_SIGNING_SECRET: ${{ inputs.jwt_signing_secret }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ inputs.google_oauth_client_id }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ inputs.google_oauth_client_secret }}
          SECRET_ID: lex/auth/${{ inputs.environment }}
        run: |
          jq -n \
            --arg jwt "$JWT_SIGNING_SECRET" \
            --arg id "$GOOGLE_OAUTH_CLIENT_ID" \
            --arg secret "$GOOGLE_OAUTH_CLIENT_SECRET" \
            '{JWT_SIGNING_SECRET:$jwt,GOOGLE_OAUTH_CLIENT_ID:$id,GOOGLE_OAUTH_CLIENT_SECRET:$secret}' \
            > /tmp/lexloop-auth-secrets.json
          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ID" \
            --secret-string file:///tmp/lexloop-auth-secrets.json
          rm -f /tmp/lexloop-auth-secrets.json
          echo "Updated $SECRET_ID"
